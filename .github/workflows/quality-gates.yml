name: quality-gates

on:
    pull_request:
    push:
        branches:
            - main

jobs:
    quality-gates:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Run repository quality gates
              shell: pwsh
              run: |
                  ./.ai/hooks/ci-validate.ps1
